[package]
name = "wiki-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "wiki_mcp"
path = "src/lib.rs"

[[bin]]
name = "repowiki-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wiki-core = { workspace = true }
wiki-engine = { workspace = true }
wiki-git = { workspace = true }
url = "2"
rmcp = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tempfile = "3"
git2 = { workspace = true }
