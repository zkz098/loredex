# crates.io publishing via Trusted Publishing (OIDC) — no long-lived API token.
#
# One-time setup per crate on https://crates.io (do this for all five:
# loredex-core, loredex-git, loredex-engine, loredex-cli, loredex-mcp):
#   crate page -> " crate owners " -> "Add trusted publishing owner"
#     Provider  : GitHub
#     Repository: zkz098/loredex
#     Workflow  : publish.yml   (this file)
#     Environment: release      (optional but recommended: add required
#                 reviewers in repo Settings -> Environments -> release)
#
# Mechanism (differs from npm/PyPI): stable `cargo publish` has no native OIDC
# exchange. The official rust-lang/crates-io-auth-action mints a short-lived
# (~30 min) crates.io token from this workflow's OIDC identity, passed to cargo
# via CARGO_REGISTRY_TOKEN. crates.io validates it against the trusted-publisher
# config (repo + workflow filename + environment) you added on the crate pages.
#
# Then bump [workspace.package].version and push a `vX.Y.Z` tag to trigger
# automatic publishing (or dispatch this workflow manually).
name: publish to crates.io
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  id-token: write   # Trusted Publishing: exchanges OIDC for a short-lived credential
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: exchange OIDC for a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: sanity build + tests
        run: |
          cargo build --workspace --locked
          cargo nextest run --workspace
      # single shell block: the ${{ ... }} expression must live in a run:
      # section to be substituted (per-step env: would pass it literally),
      # and strict order matters (each crate must appear in the index before
      # the next one resolves it)
      - name: publish workspace (dependency order)
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in loredex-core loredex-git loredex-engine loredex-cli loredex-mcp; do
            echo "::group::publish $crate"
            if out=$(CARGO_REGISTRY_TOKEN="$TOKEN" cargo publish -p "$crate" --no-verify 2>&1); then
              echo "published $crate"
            elif grep -q "already exists" <<<"$out"; then
              echo "skipped $crate (version already published)"
            else
              echo "$out"; exit 1
            fi
            echo "::endgroup::"
          done
