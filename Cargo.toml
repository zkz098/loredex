[workspace]
resolver = "2"
members = [
    "crates/loredex-core",
    "crates/loredex-git",
    "crates/loredex-engine",
    "crates/loredex-cli",
    "crates/loredex-mcp",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/zkz098/loredex"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "perf"] }
foldhash = "0.2"
mimalloc = "0.1"
git2 = "0.20"
similar = "2"
sha1 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
toml = "0.9"
loredex-core = { path = "crates/loredex-core", version = "0.1.4" }
loredex-git = { path = "crates/loredex-git", version = "0.1.4" }
loredex-engine = { path = "crates/loredex-engine", version = "0.1.4" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
