[workspace]
resolver = "2"
members = [
    "crates/wiki-core",
    "crates/wiki-git",
    "crates/wiki-engine",
    "crates/wiki-cli",
    "crates/wiki-mcp",
]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
git2 = "0.20"
similar = "2"
sha1 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
wiki-core = { path = "crates/wiki-core" }
wiki-git = { path = "crates/wiki-git" }
wiki-engine = { path = "crates/wiki-engine" }
