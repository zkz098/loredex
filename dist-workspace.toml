[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
# Shell + PowerShell installers: `curl -LsSf <url> | sh`, and cargo-binstall support
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# macOS 14 images are retired 2026-11-02 (brownouts since October); pin the
# supported images explicitly instead of relying on dist-era defaults
[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-15"
[dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-15-intel"
